<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      padding: 16px;
      margin: 0;
    }
    p {
      font-size: 13px;
      color: #44546f;
      margin: 0 0 12px 0;
    }
    button {
      background: #0c66e4;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background: #0055cc;
    }
  </style>
</head>
<body>
  <p>Para ver el contador de modificaciones, autorizá el acceso de solo lectura a esta tarjeta.</p>
  <button id="authorize-btn">Autorizar</button>

  <script>
    var API_KEY = 'c638996caa5e11f7932f1f2963509de9';

    var t = window.TrelloPowerUp.iframe({
      appKey: API_KEY,
      appName: 'Badge de notificacion de cambios por tarjeta'
    });

    // Flujo de bajo nivel (t.authorize), en vez de t.getRestApi().authorize(),
    // que tiene un bug conocido de postMessage en Power-Ups auto-hosteados.
    var returnUrl = window.location.origin + '/trello-badge-modificaciones/auth-success.html';

    var authUrl = 'https://trello.com/1/authorize'
      + '?expiration=never'
      + '&name=' + encodeURIComponent('Badge de notificacion de cambios por tarjeta')
      + '&scope=read'
      + '&key=' + API_KEY
      + '&callback_method=fragment'
      + '&return_url=' + encodeURIComponent(returnUrl);

    document.getElementById('authorize-btn').addEventListener('click', function () {
      t.authorize(authUrl, { height: 680, width: 580 })
        .then(function (token) {
          return t.set('member', 'private', 'token', token);
        })
        .then(function () {
          return t.closePopup();
        })
        .catch(function (err) {
          console.error('Error de autorizacion', err);
        });
    });
  </script>
</body>
</html>
